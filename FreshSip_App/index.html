<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LAMBJJL</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

        <style>
            body{
                scroll-behavior: smooth;
            }

            .card img {
                width: 100%;
                height: 200px;
                object-fit: cover;
            }
.navbar {
      background-color: saddlebrown; /* warna coklat */
      padding: 10px;
    }

    .navbar a {
      color: white;                  /* teks putih */
      text-decoration: none;
      margin-right: 15px;
    }

    .navbar a:hover {
      color: yellow;                 /* hover jadi kuning */
    }

        </style>
    </head>

    <body>
        <!--NAVBAR-->
            <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="#">LAMBBYCHEFJJL</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a href="#carouselExample" class="nav-link">Home</a></li>
          <li class="nav-item"><a href="#products" class="nav-link">Products</a></li>
        </ul>
      </div>
    </div>
  </nav>
        <!-- CAROUSEL -->
<div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="Images/third.jpg" class="d-block w-100">
        </div>
        <div class="carousel-item">
            <img src="Images/sec.jpg" class="d-block w-100">
        </div>
        <div class="carousel-item">
            <img src="Images/first.jpg" class="d-block w-100">
        </div>
        <div class="carousel-item">
            <img src="Images/last.jpg" class="d-block w-100">
        </div>
    </div>

    <!--LEFT BUTTON-->
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <!--RIGHT BUTTON-->
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>
    
</div>

<!-- PRODUCTS -->
<div class="container mt-5" id="products">
    <h2 class="text-center mb-4">Our SPECIAL MENU</h2>
    <div class="row" id="productList"></div>
</div>

<!-- BUTTON -->
<div class="text-center my-5">
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#registerModal">
        Become a Reseller
    </button>

    <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#cartModal">
        Your Cart
    </button>

    <button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#contactModal">
        Contact Us
    </button>
</div>

<!--RESELLER MODAL-->
<div class="modal fade" id="registerModal">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5>Reseller Registration</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="registerForm">
                    <input type="text" id="name" class="form-control mb-2" placeholder="Name">
                    <input type="email" id="email" class="form-control mb-2" placeholder="Email">
                    <input type="text" id="phone" class="form-control mb-2" placeholder="Phone">

                    <div class="form-check">
                        <input type="checkbox" id="agree" class="form-check-input">
                        <label class="form-check-label">Agree to terms</label>
                    </div>

                    <button type="submit" class="btn btn-success mt-3 w-100">Submit</button>
                </form>
            </div>

        </div>
    </div>
</div>

<!--CONTACT MODAL-->
<div class="modal fade" id="contactModal">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5>Contact Us</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="contactForm">
                    <input type="text" id="cname" class="form-control mb-2" placeholder="Name">
                    <input type="email" id="cemail" class="form-control mb-2" placeholder="Email">
                    <textarea class="form-control mb-2" id="message" placeholder="Message"></textarea>

                    <div class="form-check">
                        <input type="checkbox" id="consent" class="form-check-input">
                        <label class="form-check-label">Agree to terms</label>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 mt-3">Send</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!--CART MODAL-->
<div class="modal fade" id="cartModal">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5>Your Cart</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            
            <div class="modal-body">
                <ul id="cartList" class="list-group mb-3"></ul>
                
                <!--ORDER SUMMARY-->
                <div class="border p-3 rounded bg-light">
                    <h6>Order Summary</h6>
                    <p id="itemCount">Items: 0</p>
                    <p id="subtotal">Subtotal: RM0</p>
                    <p id="tax">Tax (6%): RM0</p>
                    <h5 id="totalPrice">Total: RM0</h5>
                </div>
            </div>

            <button class="btn btn-success w-100 mt-3" onclick="placeOrder()">
                Place Order
            </button>

        </div>
    </div>
</div>

<!--FOOTER-->
<footer class="bg-dark text-white text-center p-3">© JJLCHEFHOME 2026</footer>

<!-- SCRIPT -->
<script>

// PRODUCTS
let products = [
    {
        name: "TRADITIONAL STEAK LAMB",
        price: "35",
        desc: "Will never fails you~",
        img: "Images/sec pic.jpeg"
    },
    {
        name: "JUICESS MEDIUM ROW LAMB STICK",
        price: "37",
        desc: "habibi come to you!",
        img: "Images/third pic.webp"
    },
    {
        name: "LAMB DREAMS",
        price: "58",
        desc: "pleasure to eat with you~!",
        img: "Images/fourtpic.jpg"
    }
];

let cart = [];

// ADD TO CART
function addToCart(name, price){
    cart.push({name, price});
    alert(name + " added to cart!");
    updateCart();
}

// UPDATE CART & SUMMARY
function updateCart(){
    let list = document.getElementById("cartList");
    let total = 0;

    list.innerHTML = "";

    cart.forEach(item => {
        list.innerHTML += `
            <li class="list-group-item d-flex justify-content-between">
                ${item.name}
                <span>RM${item.price}</span>
            </li>
        `;
        total += item.price;
    });

    let itemCount = cart.length;
    let tax = total * 0.06;
    let finalTotal = total + tax;

    document.getElementById("itemCount").innerText = "Items: " + itemCount;
    document.getElementById("subtotal").innerText = "Subtotal: RM" + total.toFixed(2);
    document.getElementById("tax").innerText = "Tax (6%): RM" + tax.toFixed(2);
    document.getElementById("totalPrice").innerText = "Total: RM" + finalTotal.toFixed(2);
}

function placeOrder(){
    if(cart.length === 0){
        alert("Cart is empty!");
    } else {
        alert("Order placed successfully!");
        cart = [];
        updateCart();
    }
}

// DISPLAY PRODUCTS (ARRAY + LOOP)
products.forEach((p, index) => {
    document.getElementById("productList").innerHTML += `
        <div class="col-md-4 mb-4">
            <div class="card"
                data-bs-toggle="popover"
                data-bs-content="${p.desc}">
                
                <img src="${p.img}" class="card-img-top">

                <div class="card-body text-center">
                    <h5>${p.name}</h5>
                    <p>RM${p.price}</p>

                    <button class="btn btn-success"
                    onclick="addToCart('${p.name}', ${p.price.replace('RM', '')})">
                    Add to Cart
                    </button>

                    <button class="btn btn-outline-success"
                        data-bs-toggle="tooltip"
                        title="Healthy & Fresh!">
                        Info
                    </button>
                </div>
            </div>
        </div>
    `;
});

// TOOLTIP + POPOVER
var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
tooltipTriggerList.map(t => new bootstrap.Tooltip(t));

var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'))
popoverTriggerList.map(p => new bootstrap.Popover(p));

// FORM VALIDATION
document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let agree = document.getElementById("agree").checked;

    if(name === "" || email === "" || phone === "") {
        alert("Please fill all fields");
    }
    else if(!agree) {
        alert("You must agree to terms");
    }
    else {
        alert("Registration Successful!");
        this.reset();
    }
});

document.getElementById("contactForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let name = document.getElementById("cname").value.trim();
    let email = document.getElementById("cemail").value.trim();
    let message = document.getElementById("message").value.trim();
    let consent = document.getElementById("consent").checked;

    if(name === "" || email === "" || message === "") {
        alert("Please fill all fields");
    }
    else if(!email.includes("@")) {
        alert("Invalid email");
    }
    else if(!consent) {
        alert("You must agree to terms");
    }
    else {
        alert("Message sent successfully!");
        this.reset();
    }
});

// JQUERY ANIMATION
$("a.nav-link").click(function(e){
    e.preventDefault();
    $('html, body').animate({
        scrollTop: $($(this).attr("href")).offset().top
    }, 800);
});

</script>
    </body>
</html>
